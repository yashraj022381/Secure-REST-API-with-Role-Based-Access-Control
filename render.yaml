services:
  - type: web
    name: secure-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --timeout 120
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secure-api-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: secure-api-db
    databaseName: secure_api_db
    plan: free
